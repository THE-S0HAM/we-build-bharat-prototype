AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  CommunityOps Agent
  AI operations layer for community-led events

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  BedrockModelId:
    Type: String
    Default: amazon.nova-pro-v1:0
  BedrockRegion:
    Type: String
    Default: us-east-1
  DemoPassword:
    Type: String
    Default: ''
    NoEcho: true
    Description: >
      Password for the single restricted demo identity that POST /demo/session authenticates.
      Held only in that function's environment so the browser never receives a credential. Leave
      empty to disable demo access: the endpoint then refuses clearly and the console hides the
      demo action rather than offering a button that fails.
  QrSigningSecret:
    Type: String
    Default: ''
    NoEcho: true
    Description: >
      HMAC secret for signing ticket QR codes. ticket_service reads QR_SECRET_KEY and falls
      back to a development default when it is unset, which would mean production tickets
      were signed with a value published in the source. Pass a real secret per deployment.
      Left empty by default so a developer stack still works without configuration.

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        STAGE: !Ref Stage
        MAIN_TABLE: !Ref MainTable
        AUDIT_TABLE: !Ref AuditTable
        TICKET_BUCKET: !Ref TicketBucket
        EVENT_BUS_NAME: !Ref EventBus
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        BEDROCK_REGION: !Ref BedrockRegion
        QR_SECRET_KEY: !Ref QrSigningSecret
        POWERTOOLS_SERVICE_NAME: communityops
        LOG_LEVEL: INFO
    Architectures:
      - x86_64

Resources:

  # ===================================================================
  # Cognito - Identity
  # ===================================================================

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub CommunityOps-UserPool-${Stage}
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: name
          AttributeDataType: String
          Required: true
          Mutable: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub CommunityOps-WebClient-${Stage}
      UserPoolId: !Ref UserPool
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        # Required by AdminInitiateAuth, which the demo-session endpoint uses to sign in one
        # fixed, restricted identity without the browser ever holding a password. This does widen
        # the client's auth flows, so it is enabled deliberately: the flow is reachable only
        # through that single Lambda, which takes no username parameter and can therefore
        # authenticate nothing else.
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
      PreventUserExistenceErrors: ENABLED
      # Only Cognito's own directory. Google, Amazon and Apple would each need a UserPoolDomain,
      # a UserPoolIdentityProvider with a client id and secret obtained by registering the app with
      # that provider, plus CallbackURLs and AllowedOAuthFlows on this client. None of that is
      # committable without real provider registration, so the console does not offer those
      # buttons rather than rendering ones that cannot work.
      SupportedIdentityProviders:
        - COGNITO

  # ===================================================================
  # API Gateway
  # ===================================================================

  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub CommunityOps-API-${Stage}
      StageName: !Ref Stage
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn
      # POST /demo/session is the only route without an authorizer, so it is the only one an
      # anonymous caller can reach. A tight per-method throttle keeps it from becoming a way to
      # exhaust the Cognito AdminInitiateAuth quota for the whole pool, which would lock real users
      # out of signing in. Everything else keeps the account default, since the authorizer already
      # costs an attacker a valid token.
      #
      # Two requests a second is generous for a button a person clicks, and the handler already
      # reports Cognito's own TooManyRequestsException in terms the visitor can act on.
      MethodSettings:
        - ResourcePath: /demo/session
          HttpMethod: POST
          ThrottlingRateLimit: 2
          ThrottlingBurstLimit: 5

  # ===================================================================
  # DynamoDB Tables
  # ===================================================================

  MainTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub CommunityOps-Main-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        # GSI1 answers "everything of one kind for one event, newest last".
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        # GSI2 answers status- and deadline-ordered queries ("open tasks, soonest
        # deadline first") and "everything belonging to one user across events", which
        # GSI1's event-scoped partition key cannot express.
        - IndexName: GSI2
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  AuditTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub CommunityOps-Audit-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # ===================================================================
  # S3 - Ticket Artifacts
  # ===================================================================

  TicketBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub communityops-tickets-${Stage}-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldTickets
            Status: Enabled
            ExpirationInDays: 90
          # Parts of a multipart upload that never completed are billed as storage
          # indefinitely and do not appear in an object listing, so nothing reveals them
          # except the bill. Every bucket here gets this rule.
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  # ===================================================================
  # Static hosting for the operations console
  # ===================================================================

  # The bucket stays private. CloudFront reads it through Origin Access
  # Control, so the objects are never publicly addressable.
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub communityops-web-${Stage}-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  WebOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub communityops-web-oac-${Stage}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub CommunityOps operations console (${Stage})
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_200
        Origins:
          - Id: WebS3Origin
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: WebS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          # Managed-CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        # The console is a single-page app: unknown paths are client-side
        # routes, so they must return index.html rather than an S3 error.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${WebBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}

  # Storage for reference documents an organiser uploads.
  #
  # Nothing reads this bucket. No function carries it in its environment and no code
  # references it. It is left over from an abandoned retrieval plan, and its previous
  # comment described it as holding "RAG seed documents" — misleading, because document
  # contents are not indexed anywhere in this system and the agent can locate a document
  # but cannot tell you what is inside it.
  #
  # Kept rather than deleted: an empty bucket has no recurring charge, so removing it
  # saves nothing, while deleting a bucket is irreversible.
  KnowledgeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub communityops-knowledge-${Stage}-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  # ===================================================================
  # EventBridge
  # ===================================================================

  EventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub CommunityOps-EventBus-${Stage}

  # ===================================================================
  # Lambda Functions - Check-In
  # ===================================================================

  CheckinSearchFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub communityops-checkin-search-${Stage}
      Handler: services.checkin.handlers.search_handler
      CodeUri: .
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MainTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/checkin/search
            Method: POST

  CheckinVerifyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub communityops-checkin-verify-${Stage}
      Handler: services.checkin.handlers.verify_handler
      CodeUri: .
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MainTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/checkin/verify
            Method: POST

  CheckinRecoverFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub communityops-checkin-recover-${Stage}
      Handler: services.checkin.handlers.recover_handler
      CodeUri: .
      Timeout: 60
      MemorySize: 512
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MainTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditTable
        - S3CrudPolicy:
            BucketName: !Ref TicketBucket
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref EventBus
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/checkin/recover
            Method: POST

  CheckinReconcileFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub communityops-checkin-reconcile-${Stage}
      Handler: services.checkin.handlers.reconcile_handler
      CodeUri: .
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MainTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditTable
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref EventBus
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/checkin/reconcile
            Method: POST

  CheckinCompleteFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub communityops-checkin-complete-${Stage}
      Handler: services.checkin.handlers.complete_handler
      CodeUri: .
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MainTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditTable
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref EventBus
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/checkin/complete
            Method: POST

  CheckinVerifyQrFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub communityops-checkin-verify-qr-${Stage}
      Handler: services.checkin.handlers.verify_qr_handler
      CodeUri: .
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MainTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/checkin/verify-qr
            Method: POST

  # ===================================================================
  # Lambda Functions - Core API
  # ===================================================================

  EventsCrudFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub communityops-api-events-${Stage}
      Handler: services.api.events_handler.handler
      CodeUri: .
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MainTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditTable
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref EventBus
      Events:
        GetEvents:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events
            Method: GET
        CreateEvent:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events
            Method: POST
        GetEvent:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}
            Method: GET
        UpdateEvent:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}
            Method: PUT
        ChangeLifecycle:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/lifecycle
            Method: POST
        ArchiveEvent:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/archive
            Method: POST
        DuplicateEvent:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/duplicate
            Method: POST
        PrepareEvent:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/prepare
            Method: POST

  SpeakersCrudFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub communityops-api-speakers-${Stage}
      Handler: services.api.speakers_handler.handler
      CodeUri: .
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MainTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditTable
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref EventBus
      Events:
        GetSpeakers:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/speakers
            Method: GET
        CreateSpeaker:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/speakers
            Method: POST
        UpdateSpeaker:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/speakers/{speakerId}
            Method: PUT
        DraftFollowup:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/speakers/{speakerId}/followup
            Method: POST

  TasksCrudFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub communityops-api-tasks-${Stage}
      Handler: services.api.tasks_handler.handler
      CodeUri: .
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MainTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditTable
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref EventBus
      Events:
        GetTasks:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/teams/{teamId}/tasks
            Method: GET
        CreateTask:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/teams/{teamId}/tasks
            Method: POST
        UpdateTask:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/teams/{teamId}/tasks/{taskId}
            Method: PUT
        # Event-wide task board. The console previously fanned out one request per team and
        # flattened the results, so rendering one page took eight round trips.
        GetAllEventTasks:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/tasks
            Method: GET
        ReassignTask:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/teams/{teamId}/tasks/{taskId}/reassign
            Method: POST

  ApprovalsCrudFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub communityops-api-approvals-${Stage}
      Handler: services.api.approvals_handler.handler
      CodeUri: .
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MainTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditTable
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref EventBus
      Events:
        GetApprovals:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/approvals
            Method: GET
        GetApproval:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/approvals/{approvalId}
            Method: GET
        RequestApproval:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/approvals
            Method: POST
        DecideApproval:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/approvals/{approvalId}
            Method: PUT

  IncidentsCrudFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub communityops-api-incidents-${Stage}
      Handler: services.api.incidents_handler.handler
      CodeUri: .
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MainTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditTable
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref EventBus
      Events:
        GetIncidents:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/incidents
            Method: GET
        CreateIncident:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/incidents
            Method: POST
        GetIncident:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/incidents/{incidentId}
            Method: GET
        UpdateIncident:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/incidents/{incidentId}
            Method: PUT
        ListComments:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/incidents/{incidentId}/comments
            Method: GET
        AddComment:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/incidents/{incidentId}/comments
            Method: POST
        ResolveIncident:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/incidents/{incidentId}/resolve
            Method: POST
        ReopenIncident:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/incidents/{incidentId}/reopen
            Method: POST

  AuditLogFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub communityops-api-audit-${Stage}
      Handler: services.api.audit_handler.handler
      CodeUri: .
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref AuditTable
      Events:
        GetAuditLog:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/audit
            Method: GET

  # Operational overview. The command centre, event health, the attention list, the
  # operations brief and workload all answer "what is the state of this event" from one
  # EventSnapshot, so they share a function rather than each paying a cold start to run
  # the same aggregation. Health is cached back onto the event record, hence Crud on Main.
  OperationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub communityops-api-operations-${Stage}
      Handler: services.api.operations_handler.handler
      CodeUri: .
      Timeout: 60
      MemorySize: 512
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MainTable
        - DynamoDBReadPolicy:
            TableName: !Ref AuditTable
      Events:
        GetCommandCenter:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /command-center
            Method: GET
        GetEventHealth:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/health
            Method: GET
        GetAttention:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/attention
            Method: GET
        GetBrief:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/brief
            Method: GET
        GetWorkload:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/workload
            Method: GET
        GetAttendees:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/attendees
            Method: GET

  # ===================================================================
  # Demo access
  # ===================================================================

  # Signs in one fixed, restricted identity so a visitor can reach the product without credentials
  # ever passing through the browser. The username is a constant in the handler, not a request
  # parameter, so this cannot be used to authenticate anything else.
  DemoSessionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub communityops-api-demo-session-${Stage}
      Handler: services.api.demo_handler.handler
      CodeUri: .
      Environment:
        Variables:
          DEMO_PASSWORD: !Ref DemoPassword
          DEMO_USERNAME: demo@communityops.local
          DEMO_ORGANIZATION_ID: ORG-wemakedev
          USER_POOL_ID: !Ref UserPool
          USER_POOL_CLIENT_ID: !Ref UserPoolClient
      Policies:
        # Scoped to this pool and this one action. Notably not AdminCreateUser or
        # AdminSetUserPassword: the function signs in an identity that already exists and cannot
        # create or modify accounts.
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminInitiateAuth
              Resource: !GetAtt UserPool.Arn
      Events:
        StartDemoSession:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /demo/session
            Method: POST
            # The only unauthenticated route in the API. It has to be: its whole purpose is
            # obtaining a session for somebody who does not have one yet.
            Auth:
              Authorizer: NONE

  # ===================================================================
  # Lambda Functions - Operations domain
  # ===================================================================

  TeamsCrudFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub communityops-api-teams-${Stage}
      Handler: services.api.teams_handler.handler
      CodeUri: .
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MainTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditTable
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref EventBus
      Events:
        GetTeams:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/teams
            Method: GET
        CreateTeam:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/teams
            Method: POST
        GetTeam:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/teams/{teamId}
            Method: GET
        UpdateTeam:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/teams/{teamId}
            Method: PUT
        GetMembers:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/teams/{teamId}/members
            Method: GET
        AddMember:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/teams/{teamId}/members
            Method: POST
        RemoveMember:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/teams/{teamId}/members/{userId}
            Method: DELETE

  BudgetFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub communityops-api-budget-${Stage}
      Handler: services.api.budget_handler.handler
      CodeUri: .
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MainTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditTable
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref EventBus
      Events:
        GetBudget:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/budget
            Method: GET
        SetBudget:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/budget
            Method: PUT
        Allocate:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/budget/allocations
            Method: POST
        ListExpenses:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/budget/expenses
            Method: GET
        RecordExpense:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/budget/expenses
            Method: POST
        ProjectBudget:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/budget/projection
            Method: POST

  # Documents need S3 to sign upload and download URLs. Bytes never pass through Lambda:
  # a 15 MB venue contract would not fit inside API Gateway's request limit.
  DocumentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub communityops-api-documents-${Stage}
      Handler: services.api.documents_handler.handler
      CodeUri: .
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MainTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditTable
        - S3CrudPolicy:
            BucketName: !Ref TicketBucket
      Events:
        ListDocuments:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/documents
            Method: GET
        RequestUpload:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/documents
            Method: POST
        GetDocument:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/documents/{documentId}
            Method: GET
        ConfirmUpload:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/documents/{documentId}/confirm
            Method: POST
        DeleteDocument:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/documents/{documentId}
            Method: DELETE

  NotificationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub communityops-api-notifications-${Stage}
      Handler: services.api.notifications_handler.handler
      CodeUri: .
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MainTable
      Events:
        ListNotifications:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /notifications
            Method: GET
        MarkRead:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /notifications/{notificationId}/read
            Method: PUT
        MarkAllRead:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /notifications/read-all
            Method: PUT

  TicketsAdminFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub communityops-api-tickets-${Stage}
      Handler: services.api.tickets_handler.handler
      CodeUri: .
      # Ticket issuance renders a PDF and a QR image in-process, which needs more memory
      # and time than a plain data endpoint.
      Timeout: 60
      MemorySize: 512
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MainTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditTable
        - S3CrudPolicy:
            BucketName: !Ref TicketBucket
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref EventBus
      Events:
        ListTickets:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/tickets
            Method: GET
        GetTicket:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/tickets/{registrationId}
            Method: GET
        VerifyTransaction:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/tickets/{registrationId}/verify-transaction
            Method: POST
        IssueTicket:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/tickets/{registrationId}/issue
            Method: POST
        RevokeTicket:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/tickets/{registrationId}/revoke
            Method: POST

  # The simulation drives real mutations through the same services a person would use, so
  # it needs the same write access and enough time to aggregate the event between steps.
  SimulationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub communityops-api-simulation-${Stage}
      Handler: services.api.simulation_handler.handler
      CodeUri: .
      Timeout: 60
      MemorySize: 512
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MainTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditTable
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref EventBus
      Events:
        GetSimulation:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/simulation
            Method: GET
        AdvanceSimulation:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/simulation
            Method: POST

  # ===================================================================
  # Lambda Functions - The agent
  # ===================================================================

  # The only function permitted to invoke a model. A tool-use conversation makes several
  # sequential Bedrock calls with DynamoDB reads between them, so it gets the longest
  # timeout and the most memory in the stack.
  AgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub communityops-api-agent-${Stage}
      Handler: services.api.agent_handler.handler
      CodeUri: .
      Timeout: 120
      MemorySize: 1024
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MainTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditTable
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref EventBus
        # Scoped to the configured model rather than a wildcard. Both the bare model id and
        # the inference-profile form are listed because Converse resolves to whichever the
        # region provides, and a cross-region profile ARN lives under a different account
        # path than the foundation model itself.
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource:
                - !Sub arn:aws:bedrock:${BedrockRegion}::foundation-model/${BedrockModelId}
                - !Sub arn:aws:bedrock:*::foundation-model/${BedrockModelId}
                - !Sub arn:aws:bedrock:${BedrockRegion}:${AWS::AccountId}:inference-profile/*
      Events:
        Chat:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /agent/chat
            Method: POST
        Capabilities:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /agent/capabilities
            Method: GET
        Activity:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /agent/activity
            Method: GET
        Session:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /agent/sessions/{sessionId}
            Method: GET

  # ===================================================================
  # Step Functions - Speaker Follow-up Workflow
  # ===================================================================

  SpeakerFollowupStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub CommunityOps-SpeakerFollowup-${Stage}
      DefinitionUri: workflows/speaker-followup/definition.asl.json
      DefinitionSubstitutions:
        SpeakerFollowupFunctionArn: !GetAtt SpeakerFollowupFunction.Arn
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref SpeakerFollowupFunction

  SpeakerFollowupFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub communityops-workflow-speaker-followup-${Stage}
      Handler: services.workflows.speaker_followup.handler
      CodeUri: .
      Timeout: 120
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MainTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditTable
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref EventBus

  # ===================================================================
  # Step Functions - Incident Response Workflow
  # ===================================================================

  IncidentResponseStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub CommunityOps-IncidentResponse-${Stage}
      DefinitionUri: workflows/incident-response/definition.asl.json
      DefinitionSubstitutions:
        IncidentResponseFunctionArn: !GetAtt IncidentResponseFunction.Arn
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref IncidentResponseFunction

  IncidentResponseFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub communityops-workflow-incident-response-${Stage}
      Handler: services.workflows.incident_response.handler
      CodeUri: .
      Timeout: 120
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MainTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditTable
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref EventBus

Outputs:
  ConsoleUrl:
    Description: Public URL of the operations console
    Value: !Sub https://${WebDistribution.DomainName}
  WebBucketName:
    Description: S3 bucket holding the console build
    Value: !Ref WebBucket
  ApiUrl:
    Description: API Gateway URL
    Value: !Sub https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref UserPoolClient
  MainTableName:
    Description: Main DynamoDB table name
    Value: !Ref MainTable
  AuditTableName:
    Description: Audit DynamoDB table name
    Value: !Ref AuditTable
  TicketBucketName:
    Description: S3 bucket for ticket artifacts
    Value: !Ref TicketBucket
  EventBusName:
    Description: EventBridge event bus name
    Value: !Ref EventBus

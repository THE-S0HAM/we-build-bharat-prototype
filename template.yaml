AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  CommunityOps Agent
  AI operations layer for community-led events

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  BedrockModelId:
    Type: String
    Default: anthropic.claude-sonnet-4-20250514-v1:0
  BedrockRegion:
    Type: String
    Default: us-east-1

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        STAGE: !Ref Stage
        MAIN_TABLE: !Ref MainTable
        AUDIT_TABLE: !Ref AuditTable
        TICKET_BUCKET: !Ref TicketBucket
        EVENT_BUS_NAME: !Ref EventBus
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        BEDROCK_REGION: !Ref BedrockRegion
        POWERTOOLS_SERVICE_NAME: communityops
        LOG_LEVEL: INFO
    Architectures:
      - x86_64

Resources:

  # ===================================================================
  # Cognito - Identity
  # ===================================================================

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub CommunityOps-UserPool-${Stage}
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: name
          AttributeDataType: String
          Required: true
          Mutable: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub CommunityOps-WebClient-${Stage}
      UserPoolId: !Ref UserPool
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      SupportedIdentityProviders:
        - COGNITO

  # ===================================================================
  # API Gateway
  # ===================================================================

  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub CommunityOps-API-${Stage}
      StageName: !Ref Stage
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn

  # ===================================================================
  # DynamoDB Tables
  # ===================================================================

  MainTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub CommunityOps-Main-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  AuditTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub CommunityOps-Audit-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # ===================================================================
  # S3 - Ticket Artifacts
  # ===================================================================

  TicketBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub communityops-tickets-${Stage}-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldTickets
            Status: Enabled
            ExpirationInDays: 90

  # ===================================================================
  # Static hosting for the operations console
  # ===================================================================

  # The bucket stays private. CloudFront reads it through Origin Access
  # Control, so the objects are never publicly addressable.
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub communityops-web-${Stage}-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  WebOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub communityops-web-oac-${Stage}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub CommunityOps operations console (${Stage})
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_200
        Origins:
          - Id: WebS3Origin
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: WebS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          # Managed-CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        # The console is a single-page app: unknown paths are client-side
        # routes, so they must return index.html rather than an S3 error.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${WebBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}

  # Knowledge bucket for RAG seed documents
  KnowledgeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub communityops-knowledge-${Stage}-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ===================================================================
  # EventBridge
  # ===================================================================

  EventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub CommunityOps-EventBus-${Stage}

  # ===================================================================
  # Lambda Functions - Check-In
  # ===================================================================

  CheckinSearchFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub communityops-checkin-search-${Stage}
      Handler: services.checkin.handlers.search_handler
      CodeUri: .
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MainTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/checkin/search
            Method: POST

  CheckinVerifyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub communityops-checkin-verify-${Stage}
      Handler: services.checkin.handlers.verify_handler
      CodeUri: .
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MainTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/checkin/verify
            Method: POST

  CheckinRecoverFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub communityops-checkin-recover-${Stage}
      Handler: services.checkin.handlers.recover_handler
      CodeUri: .
      Timeout: 60
      MemorySize: 512
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MainTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditTable
        - S3CrudPolicy:
            BucketName: !Ref TicketBucket
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref EventBus
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/checkin/recover
            Method: POST

  CheckinReconcileFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub communityops-checkin-reconcile-${Stage}
      Handler: services.checkin.handlers.reconcile_handler
      CodeUri: .
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MainTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditTable
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref EventBus
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/checkin/reconcile
            Method: POST

  CheckinCompleteFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub communityops-checkin-complete-${Stage}
      Handler: services.checkin.handlers.complete_handler
      CodeUri: .
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MainTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditTable
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref EventBus
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/checkin/complete
            Method: POST

  CheckinVerifyQrFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub communityops-checkin-verify-qr-${Stage}
      Handler: services.checkin.handlers.verify_qr_handler
      CodeUri: .
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MainTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/checkin/verify-qr
            Method: POST

  # ===================================================================
  # Lambda Functions - Core API
  # ===================================================================

  EventsCrudFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub communityops-api-events-${Stage}
      Handler: services.api.events_handler.handler
      CodeUri: .
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MainTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditTable
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref EventBus
      Events:
        GetEvents:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events
            Method: GET
        CreateEvent:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events
            Method: POST
        GetEvent:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}
            Method: GET
        UpdateEvent:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}
            Method: PUT

  SpeakersCrudFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub communityops-api-speakers-${Stage}
      Handler: services.api.speakers_handler.handler
      CodeUri: .
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MainTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditTable
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref EventBus
      Events:
        GetSpeakers:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/speakers
            Method: GET
        CreateSpeaker:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/speakers
            Method: POST
        UpdateSpeaker:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/speakers/{speakerId}
            Method: PUT

  TasksCrudFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub communityops-api-tasks-${Stage}
      Handler: services.api.tasks_handler.handler
      CodeUri: .
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MainTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditTable
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref EventBus
      Events:
        GetTasks:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/teams/{teamId}/tasks
            Method: GET
        CreateTask:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/teams/{teamId}/tasks
            Method: POST
        UpdateTask:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/teams/{teamId}/tasks/{taskId}
            Method: PUT

  ApprovalsCrudFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub communityops-api-approvals-${Stage}
      Handler: services.api.approvals_handler.handler
      CodeUri: .
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MainTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditTable
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref EventBus
      Events:
        GetApprovals:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/approvals
            Method: GET
        DecideApproval:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/approvals/{approvalId}
            Method: PUT

  IncidentsCrudFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub communityops-api-incidents-${Stage}
      Handler: services.api.incidents_handler.handler
      CodeUri: .
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MainTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditTable
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref EventBus
      Events:
        GetIncidents:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/incidents
            Method: GET
        CreateIncident:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/incidents
            Method: POST
        UpdateIncident:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/incidents/{incidentId}
            Method: PUT

  AuditLogFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub communityops-api-audit-${Stage}
      Handler: services.api.audit_handler.handler
      CodeUri: .
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref AuditTable
      Events:
        GetAuditLog:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/audit
            Method: GET

  CommandCenterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub communityops-api-command-center-${Stage}
      Handler: services.api.command_center_handler.handler
      CodeUri: .
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MainTable
        - DynamoDBReadPolicy:
            TableName: !Ref AuditTable
      Events:
        GetCommandCenter:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /command-center
            Method: GET

  # ===================================================================
  # Step Functions - Speaker Follow-up Workflow
  # ===================================================================

  SpeakerFollowupStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub CommunityOps-SpeakerFollowup-${Stage}
      DefinitionUri: workflows/speaker-followup/definition.asl.json
      DefinitionSubstitutions:
        SpeakerFollowupFunctionArn: !GetAtt SpeakerFollowupFunction.Arn
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref SpeakerFollowupFunction

  SpeakerFollowupFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub communityops-workflow-speaker-followup-${Stage}
      Handler: services.workflows.speaker_followup.handler
      CodeUri: .
      Timeout: 120
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MainTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditTable
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref EventBus

  # ===================================================================
  # Step Functions - Incident Response Workflow
  # ===================================================================

  IncidentResponseStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub CommunityOps-IncidentResponse-${Stage}
      DefinitionUri: workflows/incident-response/definition.asl.json
      DefinitionSubstitutions:
        IncidentResponseFunctionArn: !GetAtt IncidentResponseFunction.Arn
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref IncidentResponseFunction

  IncidentResponseFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub communityops-workflow-incident-response-${Stage}
      Handler: services.workflows.incident_response.handler
      CodeUri: .
      Timeout: 120
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MainTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditTable
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref EventBus

Outputs:
  ConsoleUrl:
    Description: Public URL of the operations console
    Value: !Sub https://${WebDistribution.DomainName}
  WebBucketName:
    Description: S3 bucket holding the console build
    Value: !Ref WebBucket
  ApiUrl:
    Description: API Gateway URL
    Value: !Sub https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref UserPoolClient
  MainTableName:
    Description: Main DynamoDB table name
    Value: !Ref MainTable
  AuditTableName:
    Description: Audit DynamoDB table name
    Value: !Ref AuditTable
  TicketBucketName:
    Description: S3 bucket for ticket artifacts
    Value: !Ref TicketBucket
  EventBusName:
    Description: EventBridge event bus name
    Value: !Ref EventBus

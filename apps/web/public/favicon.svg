<!--
  The CommunityOps mark: the same geometry the sign-in wordmark draws in
  `src/pages/Login.tsx`, so the tab icon and the wordmark are one mark.

  This file replaces a `<link rel="icon" href="/vite.svg">` that named another
  product's asset and resolved to nothing — there was no `public/` directory to
  serve it from (requirement 3.1: one product name, in copy and in metadata).

  The two colours are literals because a favicon is an isolated document: it is
  fetched outside the page, so it can reach neither `src/styles/tokens.css` nor
  any CSS custom property. They are `--brand` (#0b6b5b) and `--bg-surface`
  (#ffffff); changing either token means changing it here too. This is the only
  place in the product where a design value is duplicated, and it is duplicated
  because the platform leaves no alternative.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="CommunityOps">
  <rect width="32" height="32" rx="7" fill="#0b6b5b" />
  <g fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.65">
    <circle cx="16" cy="16" r="9.5" />
  </g>
  <g fill="#ffffff">
    <circle cx="16" cy="16" r="3" />
    <circle cx="16" cy="6.5" r="2" />
    <circle cx="24.2" cy="20.8" r="2" />
    <circle cx="7.8" cy="20.8" r="2" />
  </g>
</svg>
